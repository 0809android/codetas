[workspace]
members = [
  "apps/desktop/src-tauri",
  "crates/codetas-gateway",
]
resolver = "2"

# Every lint that can point at a bug (dead code, unreachable code, unused
# assignments, identical branches, locks held across `.await`) is enforced by
# the `-D warnings` gate in CI. The allowances below are kept on purpose.
[workspace.lints.rust]
# Newer stable toolchains deprecate std APIs (e.g. fetch_update -> try_update)
# that older ones still need; do not let a toolchain bump break the gate.
deprecated = "allow"

[workspace.lints.clippy]
# Style: most hits are test fixtures that read better as default-then-assign.
field_reassign_with_default = "allow"
# Design-level: provider adapters pass many independent request parts and
# return rich error responses. Splitting them up would only add wrapper types.
type_complexity = "allow"
too_many_arguments = "allow"
result_large_err = "allow"
