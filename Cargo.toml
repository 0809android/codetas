[workspace]
members = [
  "apps/desktop/src-tauri",
  "crates/codetas-gateway",
]
resolver = "2"

# Lints that predate the clippy gate in CI. Allowed so that `-D warnings`
# catches new problems; tighten these one at a time.
[workspace.lints.rust]
dead_code = "allow"
# Newer stable toolchains deprecate std APIs (e.g. fetch_update -> try_update)
# that older ones still need; do not let a toolchain bump break the gate.
deprecated = "allow"
unused_assignments = "allow"
unreachable_code = "allow"
unreachable_patterns = "allow"
non_snake_case = "allow"

[workspace.lints.clippy]
field_reassign_with_default = "allow"
type_complexity = "allow"
too_many_arguments = "allow"
if_same_then_else = "allow"
result_large_err = "allow"
wrong_self_convention = "allow"
await_holding_lock = "allow"
