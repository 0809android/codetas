name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run build --workspace @codetas/web

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JSON manifests
        run: |
          python -m json.tool plugins/codetas/.codex-plugin/plugin.json >/dev/null
          python -m json.tool plugins/codetas/.mcp.json >/dev/null
          python -m json.tool plugins/codetas/hooks/hooks.json >/dev/null
          python -m json.tool .agents/plugins/marketplace.json >/dev/null
      - name: Compile plugin scripts
        run: python -m compileall -q plugins/codetas/hooks plugins/codetas/scripts

  desktop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --workspace
      - run: cargo test -p codetas-gateway
      - run: cargo test -p codetas-desktop

  service-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: cargo check -p codetas-desktop
