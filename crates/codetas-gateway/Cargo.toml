[package]
name = "codetas-gateway"
version = "0.1.0"
description = "Provider-neutral local Responses API gateway for CODETAS"
authors = ["kinocode.jp"]
license = "Apache-2.0"
edition = "2021"

[dependencies]
async-stream = "0.3"
axum = { version = "0.8", features = ["json", "ws"] }
base64 = "0.22"
bytes = "1"
crc32fast = "1"
dirs = "6"
ed25519-dalek = "2"
futures-util = "0.3"
fs2 = "0.4"
httpdate = "1"
http-body = "1"
keyring = "4.1.5"
png = "0.18"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip", "brotli", "deflate", "zstd"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tower-http = { version = "0.6", features = ["decompression-full"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
